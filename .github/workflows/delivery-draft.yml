name: Prepare an independently qualified public draft

on:
  workflow_call:
    inputs:
      source_run_id:
        type: string
        required: true
      source_attempt:
        type: string
        required: true
      source_commit:
        type: string
        required: true
      target:
        type: string
        required: true
      create_draft:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: public-draft-${{ inputs.source_commit }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.workflow == 'Release'
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.stage.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify provenance, sources and independent qualification for final bytes
        env:
          GH_TOKEN: ${{ github.token }}
          NOH_DELIVERY_WORKFLOW_ID: ${{ vars.NOH_DELIVERY_WORKFLOW_ID }}
          NOH_SOURCE_RUN: ${{ inputs.source_run_id }}
          NOH_SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
          NOH_SOURCE_COMMIT: ${{ inputs.source_commit }}
          NOH_TARGET: ${{ inputs.target }}
        run: python tools/delivery-release.py --run "$env:NOH_SOURCE_RUN" --attempt "$env:NOH_SOURCE_ATTEMPT" --commit "$env:NOH_SOURCE_COMMIT" --target "$env:NOH_TARGET" --output staged
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: stage
        with:
          name: independently-qualified-delivery
          path: staged/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  draft:
    needs: verify
    if: inputs.create_draft && github.ref == 'refs/heads/main' && github.workflow == 'Release'
    environment: noh-public-draft
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          path: staged
      - name: Create an inert draft; never execute or rebuild downloaded content
        env:
          GH_TOKEN: ${{ github.token }}
          NOH_SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          if($env:NOH_SOURCE_COMMIT -notmatch '^[0-9a-f]{40}$'){throw 'Invalid source commit'}
          $protection=gh api "repos/$env:GITHUB_REPOSITORY/environments/noh-public-draft" | ConvertFrom-Json
          $reviews=@($protection.protection_rules | Where-Object {$_.type -eq 'required_reviewers' -and @($_.reviewers).Count -gt 0 -and $_.prevent_self_review -eq $true})
          if($reviews.Count -ne 1){throw 'Independent environment review is not configured'}
          $stage=Get-Content staged/STAGED.json -Raw | ConvertFrom-Json
          if($stage.schema_version -ne 1 -or $stage.source_commit -ne $env:NOH_SOURCE_COMMIT){throw 'Incorrect stage identity'}
          $expected=@($stage.assets.PSObject.Properties.Name)
          $files=@(Get-ChildItem staged -Force)
          if(@($files | Where-Object {$_.PSIsContainer -or $_.LinkType}).Count -gt 0 -or $files.Count -ne $expected.Count+1){throw 'Unexpected stage entries'}
          foreach($name in $expected){
            if($name -notmatch '^[A-Za-z0-9._-]+$'){throw 'Unsafe asset name'}
            $spec=$stage.assets.$name
            $file=Get-Item -LiteralPath "staged/$name"
            if($file.Length -ne $spec.size -or $file.Length -ge 2147483648 -or (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $spec.sha256){throw 'Changed or oversized staged asset'}
          }
          $version=($expected | Where-Object {$_ -match '^NOH-([0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?)-windows-x64\.zip$|^NOH-([0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?)-macos-arm64\.zip$'} | Select-Object -First 1)
          if(!$version){throw 'Missing named application package'}
          $version=$version -replace '^NOH-','' -replace '-(windows-x64|macos-arm64)\.zip$',''
          $tag="v$version"
          # Refuse an existing tag or release; no edits, overwrite or publication toggle.
          $refs=gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag" | ConvertFrom-Json
          if(@($refs | Where-Object {$_.ref -eq "refs/tags/$tag"}).Count -gt 0){throw 'Tag already exists'}
          $notes="Independently reviewed candidate assets for source $env:NOH_SOURCE_COMMIT. This is a draft. Inspect qualification evidence and platform installation notes before any separate human publication."
          $assets=@($files | ForEach-Object {$_.FullName})
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:NOH_SOURCE_COMMIT --draft --title "NOH $version" --notes $notes
