name: Linux desktop VM feasibility

on:
  push:
    branches: [codex/linux-desktop-vm-probe]
    paths:
      - .github/workflows/linux-desktop-probe.yml
      - tools/probe-linux-desktop-vm.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-desktop-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ubuntu-gnome:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe a real GNOME Wayland guest with virtual graphics and audio
        run: timeout --signal=TERM --kill-after=30s 30m bash tools/probe-linux-desktop-vm.sh
      - name: Retain bounded feasibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-desktop-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/linux-desktop-probe/
          if-no-files-found: error
          retention-days: 7
