name: Measure cached Windows runtime acquisition

on:
  workflow_dispatch:
  # Bootstrap this diagnostic on its reviewed branch without modifying main.
  # A branch-only new workflow cannot rely on manual dispatch registration.
  push:
    branches: [codex/setup-release]
    paths: ['.github/workflows/windows-runtime-measure.yml']

permissions:
  contents: read

concurrency:
  group: windows-setup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    if: github.event.repository.private && github.ref == 'refs/heads/codex/setup-release'
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the measured implementation baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b5a52bd75365c5bff5a8576e592f8314c4ca1c27
          path: .mcp-dev/runtime-baseline
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
      - name: Restore the original runtime downloads without writing a cache
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/noh-downloads
          # Pinned diagnostic reference: run 37469621614, cache 8572635570.
          # Every consumed object is rehashed against each source tree's pins.
          key: noh-runtime-v1-windows-x64-d88c3148333c2bdc3010ac0778a8920f2c165bf5fe17dba938f27600c32be8dd
      - name: Require the cached inputs and check synthetic delivery controls
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:CACHE_HIT -ne 'true') { throw 'Reference cache unavailable; stopped before acquisition' }
          python tools/test-delivery.py
      - name: Compare full acquisition on the same runner with the same cached bytes
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          . ./tools/update-qualification/common.ps1
          $evidence = Join-Path $workspace 'logs/ci-runtime'
          [void][IO.Directory]::CreateDirectory($evidence)
          $python = (Get-Command python).Source
          $script = Join-Path $workspace 'tools/measure-windows-runtime.py'
          Invoke-RecordedProcess $python @($script,'acquire','--source',"$workspace/.mcp-dev/runtime-baseline",'--cache',"$env:RUNNER_TEMP/noh-downloads",'--output',"$evidence/baseline",'--record',"$evidence/baseline.json") $workspace "$evidence/baseline" 600
          Invoke-RecordedProcess $python @($script,'acquire','--source',$workspace,'--cache',"$env:RUNNER_TEMP/noh-downloads",'--output',"$evidence/candidate",'--record',"$evidence/candidate.json") $workspace "$evidence/candidate" 600
          python $script compare --baseline "$evidence/baseline.json" --candidate "$evidence/candidate.json" --record "$evidence/comparison.json"
      - name: Keep measurements and failure logs only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noh-runtime-measurements
          path: |
            logs/ci-runtime/*.json
            logs/ci-runtime/*.log
          if-no-files-found: warn
          retention-days: 7
