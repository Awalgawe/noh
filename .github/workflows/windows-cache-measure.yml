name: Measure Windows production runtime cache selection

on:
  workflow_dispatch:
  push:
    branches: [codex/setup-release]
    paths: ['.github/workflows/windows-cache-measure.yml']

permissions:
  contents: read

concurrency:
  group: windows-setup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    if: github.event.repository.private && github.ref == 'refs/heads/codex/setup-release'
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
      - name: Resolve and validate exact cache policies
        id: keys
        env:
          ORIGINAL_KEY: noh-runtime-v1-windows-x64-${{ hashFiles('assets/delivery-windows.lock.json', 'assets/windows-native.lock.json', 'assets/speech-bundle.json', 'assets/preview-runtime.json', 'assets/delivery-policy.json', 'assets/rust-notices.lock.json', 'tools/delivery.py', 'tools/windows_runtime.py', 'tools/windows_test_runtime.py', 'tools/rust_notices.py') }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/test-runtime-cache.py
          python tools/runtime_cache.py --record logs/ci-cache/keys.json --github-output "$env:GITHUB_OUTPUT"
          $keys = Get-Content logs/ci-cache/keys.json -Raw | ConvertFrom-Json
          if ($keys.implementation_key -ne $env:ORIGINAL_KEY -or -not $keys.legacy) { throw 'Audited cache identity differs' }
          $drive = Get-PSDrive -Name ([IO.Path]::GetPathRoot($env:RUNNER_TEMP).Substring(0,1))
          if ($drive.Free -lt 12GB) { throw 'At least 12 GiB free space required for the two arms' }
          if (Test-Path -LiteralPath "$env:RUNNER_TEMP/noh-downloads") { throw 'Raw cache path is not fresh' }
      - name: Check compatible reference availability before cold fetch
        id: lookup
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/noh-downloads
          key: ${{ steps.keys.outputs.primary }}
          restore-keys: ${{ steps.keys.outputs.legacy }}
          lookup-only: true
      - name: Require the initial legacy transition
        env:
          MATCHED: ${{ steps.lookup.outputs.cache-matched-key }}
          LEGACY: ${{ steps.keys.outputs.legacy }}
        run: |
          if ($env:MATCHED -ne $env:LEGACY -or -not $env:MATCHED) { throw 'Compatible legacy transition unavailable or already promoted' }
      - name: Restore baseline production policy
        id: baseline-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/noh-downloads
          key: ${{ steps.keys.outputs.implementation_key }}
      - name: Measure baseline shared consumers after the real miss
        env:
          MATCHED: ${{ steps.baseline-cache.outputs.cache-matched-key }}
        run: |
          . ./tools/update-qualification/common.ps1
          if ($env:MATCHED) { throw 'Baseline unexpectedly restored a cache' }
          $cache = Assert-ChildPath "$env:RUNNER_TEMP/noh-downloads" $env:RUNNER_TEMP
          [void][IO.Directory]::CreateDirectory($cache)
          if (@(Get-ChildItem -Force -LiteralPath $cache).Count) { throw 'Baseline cache is not empty' }
          $evidence = Join-Path $workspace 'logs/ci-cache'
          Invoke-RecordedProcess (Get-Command python).Source @('tools/measure-runtime-cache.py','acquire','--arm','baseline','--cache',$cache,'--output',"$env:RUNNER_TEMP/noh-cache-baseline-outputs",'--record',"$evidence/baseline.json") $workspace "$evidence/baseline" 900
          $saved = Assert-ChildPath "$env:RUNNER_TEMP/noh-cache-baseline-downloads" $env:RUNNER_TEMP
          if (Test-Path -LiteralPath $saved) { throw 'Baseline preservation path already exists' }
          Move-Item -LiteralPath $cache -Destination $saved
      - name: Restore candidate production policy
        id: candidate-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/noh-downloads
          key: ${{ steps.keys.outputs.primary }}
          restore-keys: ${{ steps.keys.outputs.legacy }}
      - name: Require candidate cache identity
        env:
          MATCHED: ${{ steps.candidate-cache.outputs.cache-matched-key }}
          LEGACY: ${{ steps.keys.outputs.legacy }}
        run: |
          if ($env:MATCHED -ne $env:LEGACY -or -not $env:MATCHED) { throw 'Expected exact compatible legacy cache' }
      - name: Measure candidate shared consumers with revalidated cached bytes
        run: |
          . ./tools/update-qualification/common.ps1
          $evidence = Join-Path $workspace 'logs/ci-cache'
          Invoke-RecordedProcess (Get-Command python).Source @('tools/measure-runtime-cache.py','acquire','--arm','candidate','--cache',"$env:RUNNER_TEMP/noh-downloads",'--output',"$env:RUNNER_TEMP/noh-cache-candidate-outputs",'--record',"$evidence/candidate.json") $workspace "$evidence/candidate" 900
      - name: Prescreen equal validated outputs before promotion
        id: prescreen
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/measure-runtime-cache.py compare --baseline logs/ci-cache/baseline.json --candidate logs/ci-cache/candidate.json --record logs/ci-cache/prescreen.json --github-output "$env:GITHUB_OUTPUT"
      - name: Promote validated inputs once
        id: promotion
        if: steps.prescreen.outputs.eligible == 'true' && steps.candidate-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/codex/setup-release'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/noh-downloads
          key: ${{ steps.keys.outputs.primary }}
      - name: Record cache action receipts for the final cost decision
        if: always()
        env:
          BASELINE_MATCHED: ${{ steps.baseline-cache.outputs.cache-matched-key }}
          CANDIDATE_MATCHED: ${{ steps.candidate-cache.outputs.cache-matched-key }}
          LOOKUP_MATCHED: ${{ steps.lookup.outputs.cache-matched-key }}
          PROMOTION_OUTCOME: ${{ steps.promotion.outcome }}
        run: |
          . ./tools/update-qualification/common.ps1
          [void][IO.Directory]::CreateDirectory('logs/ci-cache')
          Write-Json @{ baseline=$env:BASELINE_MATCHED; candidate=$env:CANDIDATE_MATCHED; lookup=$env:LOOKUP_MATCHED; promotion_outcome=$env:PROMOTION_OUTCOME } 'logs/ci-cache/cache-actions.json'
      - name: Keep measurements and partial failure logs only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noh-cache-measurements
          path: |
            logs/ci-cache/*.json
            logs/ci-cache/*.log
          if-no-files-found: warn
          retention-days: 7
