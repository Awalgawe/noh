name: Prepare and publish a qualified Windows update trial

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful approved artifact-producing run ID
        required: true
        type: string
      source_commit:
        description: Exact qualified source commit (40 lowercase hex characters)
        required: true
        type: string
      version:
        description: Exact signed release version
        required: true
        type: string
      tag:
        description: New private trial release tag matching the signed URLs
        required: true
        type: string
      publish_trial:
        description: Publish only after independent qualification and environment review
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: noh-update-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  NOH_SOURCE_RUN: ${{ inputs.source_run_id }}
  NOH_SOURCE_COMMIT: ${{ inputs.source_commit }}
  NOH_RELEASE_VERSION: ${{ inputs.version }}
  NOH_RELEASE_TAG: ${{ inputs.tag }}

jobs:
  prepare:
    if: github.event.repository.private && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.stage.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check artifact provenance and exact inventory
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NOH_APPROVED_WORKFLOW_ID: ${{ vars.NOH_UPDATE_ARTIFACT_WORKFLOW_ID }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:NOH_SOURCE_RUN -notmatch '^[1-9][0-9]*$' -or $env:NOH_SOURCE_COMMIT -notmatch '^[0-9a-f]{40}$' -or $env:NOH_APPROVED_WORKFLOW_ID -notmatch '^[1-9][0-9]*$'){throw 'Invalid or unconfigured provenance inputs'}
          $runJson=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:NOH_SOURCE_RUN"
          if($LASTEXITCODE -ne 0){throw 'Cannot inspect source run'}
          $run=$runJson|ConvertFrom-Json
          if($run.repository.full_name -ne $env:GITHUB_REPOSITORY -or $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or $run.workflow_id.ToString() -ne $env:NOH_APPROVED_WORKFLOW_ID -or $run.head_sha -ne $env:NOH_SOURCE_COMMIT -or $run.head_branch -ne 'main' -or $run.event -ne 'workflow_dispatch' -or $run.status -ne 'completed' -or $run.conclusion -ne 'success'){throw 'Unapproved source run'}
          $inventoryJson=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:NOH_SOURCE_RUN/artifacts?per_page=100"
          if($LASTEXITCODE -ne 0){throw 'Cannot inspect artifact inventory'}
          $inventory=$inventoryJson|ConvertFrom-Json
          if($inventory.total_count -ne 1 -or $inventory.artifacts[0].name -ne 'noh-update-staged' -or $inventory.artifacts[0].expired){throw 'Missing, extra, ambiguous or expired artifact'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: noh-update-staged
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: staged
      - name: Build trusted offline verifier
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          cargo +stable build --locked --profile qa --features updates --example update-release
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Verify complete signed trial
        shell: pwsh
        env:
          NOH_PUBLIC_KEYS: ${{ vars.NOH_UPDATE_PUBLIC_KEYS }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:NOH_PUBLIC_KEYS)){throw 'Independent public keys are not configured'}
          $keys=Join-Path $env:RUNNER_TEMP 'noh-independent-public-keys.json'
          Set-Content -LiteralPath $keys $env:NOH_PUBLIC_KEYS -Encoding utf8NoBOM
          ./tools/publish-update-release.ps1 -Mode Verify -Directory staged -Verifier target/qa/examples/update-release.exe -PublicKeys $keys -Version $env:NOH_RELEASE_VERSION -Tag $env:NOH_RELEASE_TAG -SourceCommit $env:NOH_SOURCE_COMMIT
      - name: Stage complete verified assets
        id: stage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noh-update-verified
          path: staged/**
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    if: inputs.publish_trial && github.event.repository.private && github.ref == 'refs/heads/main'
    environment: noh-private-update-trial
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          merge-multiple: true
          path: staged
      - name: Require configured review protection
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json=gh api "repos/$env:GITHUB_REPOSITORY/environments/noh-private-update-trial"
          if($LASTEXITCODE -ne 0){throw 'Cannot inspect environment protection; publication refused'}
          $environment=$json|ConvertFrom-Json
          $reviews=@($environment.protection_rules|Where-Object {$_.type -eq 'required_reviewers' -and @($_.reviewers).Count -gt 0})
          if($reviews.Count -ne 1 -or $reviews[0].prevent_self_review -ne $true){throw 'Required independent review protection is not configured'}
      - name: Build trusted offline verifier
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          cargo +stable build --locked --profile qa --features updates --example update-release
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Publish complete qualified trial only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NOH_PUBLIC_KEYS: ${{ vars.NOH_UPDATE_PUBLIC_KEYS }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:NOH_PUBLIC_KEYS)){throw 'Independent public keys are not configured'}
          $keys=Join-Path $env:RUNNER_TEMP 'noh-independent-public-keys.json'
          Set-Content -LiteralPath $keys $env:NOH_PUBLIC_KEYS -Encoding utf8NoBOM
          ./tools/publish-update-release.ps1 -Mode Publish -Directory staged -Verifier target/qa/examples/update-release.exe -PublicKeys $keys -Version $env:NOH_RELEASE_VERSION -Tag $env:NOH_RELEASE_TAG -SourceCommit $env:NOH_SOURCE_COMMIT
