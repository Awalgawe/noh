name: Windows installers

on:
  workflow_call:
    inputs:
      source_run_id:
        type: string
        required: true
      source_attempt:
        type: string
        required: true
      source_commit:
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-installer:
    if: github.repository_id == '1411000018' && github.ref == 'refs/heads/main' && github.workflow == 'Release'
    runs-on: windows-2025
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Record the disposable runner boundary
        env:
          HOSTED_KIND: ${{ runner.environment }}
        run: '"NOH_RUNNER_ENVIRONMENT=$env:HOSTED_KIND" >> $env:GITHUB_ENV'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Check installer validation guards
        run: python -m unittest discover -s tools/installer -p 'test_*.py'
      - name: Verify the successful Release build and exact source identity
        env:
          GH_TOKEN: ${{ github.token }}
          NOH_DELIVERY_WORKFLOW_ID: ${{ vars.NOH_DELIVERY_WORKFLOW_ID }}
          NOH_SOURCE_RUN: ${{ inputs.source_run_id }}
          NOH_SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
          NOH_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: python tools/installer/public-ci.py prepare
      - name: Install the pinned Inno Setup compiler on this disposable runner
        run: |
          $compiler = ./tools/installer-tools.ps1 -Directory "$env:RUNNER_TEMP/noh-inno"
          "NOH_ISCC_DIRECTORY=$compiler" >> $env:GITHUB_ENV
      - name: Package three profiles and the web selector from unchanged application bytes
        run: python tools/installer/public-ci.py build
      - name: Test profiles, component additions, repair, rejection and removal
        run: python tools/installer/public-ci.py test
      - name: Retain exact tested bytes and evidence in an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/installer/public-ci.py stage
      - name: Show bounded diagnostics
        if: always()
        run: |
          Get-ChildItem "$env:RUNNER_TEMP/noh-public-installer" -Filter '*.log' -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output $_.Name
            Get-Content -LiteralPath $_.FullName -Tail 20
          }
