name: Measure Windows release LTO candidate

on:
  workflow_dispatch:
  push:
    branches: [codex/setup-release]
    paths: ['.github/workflows/windows-lto-measure.yml']

permissions:
  contents: read

concurrency:
  group: windows-setup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    if: github.event.repository.private && github.ref == 'refs/heads/codex/setup-release'
    runs-on: windows-2025
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: never
      RUSTFLAGS: -C linker-flavor=ld.lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
      - name: Resolve pinned toolchain
        id: paths
        run: |
          $policy = Get-Content assets/delivery-policy.json -Raw | ConvertFrom-Json
          $toolchain = "$($policy.rust_version)-x86_64-pc-windows-gnu"
          $root = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $env:USERPROFILE '.rustup' }
          "toolchain=$toolchain" >> $env:GITHUB_OUTPUT
          "rust_path=$root/toolchains/$toolchain" >> $env:GITHUB_OUTPUT
      - name: Restore pinned Rust
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.paths.outputs.rust_path }}
          key: noh-toolchain-v1-windows-2025-${{ runner.arch }}-${{ steps.paths.outputs.toolchain }}-rustfmt
      - name: Restore verified compiler archives
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/noh-setup-tools/*.zip
          key: noh-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('assets/setup-tools.lock.json', 'tools/setup-tools.ps1') }}
      - name: Prepare existing compiler contract
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RUSTFLAGS -ne '-C linker-flavor=ld.lld' -or $env:CARGO_ENCODED_RUSTFLAGS) { throw 'Unexpected compiler flags' }
          $policy = Get-Content assets/delivery-policy.json -Raw | ConvertFrom-Json
          $toolchain = "$($policy.rust_version)-x86_64-pc-windows-gnu"
          rustup toolchain install $toolchain --profile minimal --component rustfmt
          rustup default $toolchain
          "RUSTUP_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
          $tools = ./tools/setup-tools.ps1 -Directory "$env:RUNNER_TEMP/noh-setup-tools"
          "CC=$($tools.compiler)/clang.exe" >> $env:GITHUB_ENV
          "AR=$($tools.compiler)/llvm-ar.exe" >> $env:GITHUB_ENV
      - name: Restore historical QA dependencies read-only
        id: qa
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          RUSTFLAGS: ''
        with:
          shared-key: noh-windows-2025-gnu-qa-release
          workspaces: . -> target
          cache-bin: 'false'
          cache-workspace-crates: 'false'
          cache-on-failure: 'false'
          save-if: 'false'
      - name: Restore pinned raw runtime read-only
        id: runtime
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/noh-downloads
          key: noh-runtime-v1-windows-x64-d88c3148333c2bdc3010ac0778a8920f2c165bf5fe17dba938f27600c32be8dd
      - name: Require warm inputs and format
        env:
          QA_HIT: ${{ steps.qa.outputs.cache-hit }}
          RUNTIME_HIT: ${{ steps.runtime.outputs.cache-hit }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:QA_HIT -ne 'true' -or $env:RUNTIME_HIT -ne 'true') { throw 'Reference cache unavailable; stopped before compilation' }
          cargo fmt --all --check
          # The historical action cache omits part of the registry index.
          # Resolve locked Windows inputs once; measured builds stay offline.
          cargo fetch --locked --target x86_64-pc-windows-gnu
      - name: Compare warm release compilation with verbose-log validation
        id: measure
        run: ./tools/measure-windows-lto.ps1 -Cache "$env:RUNNER_TEMP/noh-downloads" -Runtime "$env:RUNNER_TEMP/noh-test-ffmpeg"
      - name: Retain diagnostics only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noh-lto-measurements
          path: |
            logs/ci-lto/*.json
            logs/ci-lto/*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Retain selected experimental executables for final-byte qualification
        if: always() && steps.measure.outputs.candidate_selected == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noh-lto-experimental-binaries
          path: logs/ci-lto/binaries/*/*.exe
          if-no-files-found: error
          retention-days: 3
