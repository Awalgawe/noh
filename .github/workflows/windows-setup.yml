name: Windows Setup profile candidates and updater tests

on:
  workflow_dispatch:
    inputs:
      version:
        description: New application version, newer than the retained baseline
        required: true
        default: '0.1.2'
        type: string
      verify_build_graph:
        description: Validate QA/helper reuse against the existing QA cache, without producing a release
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-setup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-audit:
    uses: ./.github/workflows/rust-audit.yml

  preflight:
    if: github.event.repository.private && github.ref == 'refs/heads/codex/setup-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # GitHub draft visibility requires push access; no mutation here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check retained baseline and prepared private slot before compilation
        if: ${{ !inputs.verify_build_graph }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ inputs.version }}
        run: |
          python3 tools/setup_delivery.py baseline --lock assets/setup-baseline.lock.json --new-version "$NEW_VERSION"
          python3 tools/setup_delivery.py slot --commit "$GITHUB_SHA" --version "$NEW_VERSION"

  candidate:
    # Internal qualification files include unreviewed native redistribution
    # materials. Public release gates remain separate and closed.
    if: github.event.repository.private && github.ref == 'refs/heads/codex/setup-release'
    needs: [rust-audit, preflight]
    runs-on: windows-2025
    timeout-minutes: 180
    outputs:
      source_attempt: ${{ steps.baseline.outputs.attempt }}
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: never
      # A frozen snapshot has its own .cargo/config.toml beneath the checkout.
      # RUSTFLAGS takes precedence over merged config arrays, so both trees use
      # exactly one LLD flag and share compatible compiled dependencies.
      RUSTFLAGS: -C linker-flavor=ld.lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Validate producer inputs before expensive work
        id: baseline
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m unittest discover -s tools -p 'test_setup_delivery.py'
          "attempt=$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
      - name: Resolve the pinned Rust cache path
        id: cache-paths
        run: |
          $policy = Get-Content assets/delivery-policy.json -Raw | ConvertFrom-Json
          $toolchain = "$($policy.rust_version)-x86_64-pc-windows-gnu"
          $rustupRoot = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $env:USERPROFILE '.rustup' }
          "toolchain=$toolchain" >> $env:GITHUB_OUTPUT
          "rust_path=$rustupRoot/toolchains/$toolchain" >> $env:GITHUB_OUTPUT
      - name: Restore pinned Rust toolchain
        id: rust-toolchain-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-paths.outputs.rust_path }}
          key: noh-toolchain-v1-windows-2025-${{ runner.arch }}-${{ steps.cache-paths.outputs.toolchain }}-rustfmt
      - name: Restore verified tool archives
        id: setup-tools-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          # Archive hashes are checked before fresh extraction. Do not restore
          # marker files or unauthenticated extracted executables.
          path: ${{ runner.temp }}/noh-setup-tools/*.zip
          key: noh-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('assets/setup-tools.lock.json', 'tools/setup-tools.ps1') }}
      - name: Prepare pinned compiler and packager
        env:
          NOH_SETUP_PUBLIC_KEYS: ${{ vars.NOH_SETUP_PUBLIC_KEYS }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RUSTFLAGS -ne '-C linker-flavor=ld.lld' -or $env:CARGO_ENCODED_RUSTFLAGS) { throw 'Unexpected effective compiler flags' }
          $noticeLock = Get-Content assets/rust-notices.lock.json -Raw | ConvertFrom-Json
          foreach ($crate in $noticeLock.crates.PSObject.Properties) {
            $tree = $crate.Value.source_tree
            if ($tree -and (Get-FileHash -LiteralPath $tree.path).Hash.ToLowerInvariant() -ne $tree.sha256) { throw "Pinned source tree evidence changed: $($tree.path)" }
          }
          if ([string]::IsNullOrWhiteSpace($env:NOH_SETUP_PUBLIC_KEYS)) { throw 'Configure stable NOH_SETUP_PUBLIC_KEYS before building release candidates' }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/noh-setup-public-keys.json", $env:NOH_SETUP_PUBLIC_KEYS)
          $policy = Get-Content assets/delivery-policy.json -Raw | ConvertFrom-Json
          $toolchain = "$($policy.rust_version)-x86_64-pc-windows-gnu"
          rustup toolchain install $toolchain --profile minimal --component rustfmt
          rustup default $toolchain
          "RUSTUP_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
          $tools = ./tools/setup-tools.ps1 -Directory "$env:RUNNER_TEMP/noh-setup-tools"
          "CC=$($tools.compiler)/clang.exe" >> $env:GITHUB_ENV
          "AR=$($tools.compiler)/llvm-ar.exe" >> $env:GITHUB_ENV
      - name: Save pinned Rust toolchain after setup
        if: steps.rust-toolchain-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/codex/setup-release'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-paths.outputs.rust_path }}
          key: ${{ steps.rust-toolchain-cache.outputs.cache-primary-key }}
      - name: Save verified tool archives after setup
        if: steps.setup-tools-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/codex/setup-release'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/noh-setup-tools/*.zip
          key: ${{ steps.setup-tools-cache.outputs.cache-primary-key }}
      - name: Restore Cargo downloads and compiled dependencies
        if: ${{ !inputs.verify_build_graph }}
        id: cargo-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # This action ignores key when shared-key is supplied. Include the
          # tool contract here; v2 retires the immutable QA-only failed-run cache.
          shared-key: noh-windows-2025-gnu-qa-release-v2-${{ hashFiles('assets/setup-tools.lock.json', 'assets/delivery-policy.json') }}
          workspaces: . -> target
          cache-bin: 'false'
          cache-workspace-crates: 'false'
          # Do not freeze a partial dependency cache after an early QA failure.
          cache-on-failure: 'false'
          save-if: ${{ github.ref == 'refs/heads/codex/setup-release' }}
      - name: Restore the measured QA reference without modifying it
        if: inputs.verify_build_graph
        id: qa-reference-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          # Read-only migration: v1 was hashed without this environment value.
          # Its root artifacts already have the same single LLD flag. All build
          # steps retain the job's explicit RUSTFLAGS, including nested snapshots.
          RUSTFLAGS: ''
        with:
          shared-key: noh-windows-2025-gnu-qa-release
          workspaces: . -> target
          cache-bin: 'false'
          cache-workspace-crates: 'false'
          cache-on-failure: 'false'
          save-if: 'false'
      - name: Require the measured reference before a targeted comparison
        if: inputs.verify_build_graph
        env:
          REFERENCE_HIT: ${{ steps.qa-reference-cache.outputs.cache-hit }}
        run: |
          if ($env:REFERENCE_HIT -ne 'true') { throw 'QA reference cache unavailable; comparison stopped before compilation' }
          if ($env:RUSTFLAGS -ne '-C linker-flavor=ld.lld' -or $env:CARGO_ENCODED_RUSTFLAGS) { throw 'Unexpected effective compiler flags' }
      - name: Fetch locked Cargo dependencies
        run: cargo fetch --locked
      - name: Resolve locked runtime cache identity
        id: runtime-keys
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/test-runtime-cache.py
          python tools/runtime_cache.py --record logs/setup/runtime-cache-keys.json --github-output "$env:GITHUB_OUTPUT"
      - name: Restore locked runtime downloads
        id: runtime-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          # fetch() rehashes every restored input. Extraction and validation run
          # normally; no installed tree, credentials or final package is cached.
          path: ${{ runner.temp }}/noh-downloads
          key: ${{ steps.runtime-keys.outputs.primary }}
          restore-keys: ${{ steps.runtime-keys.outputs.legacy }}
      - name: Require the selected runtime cache identity
        env:
          MATCHED: ${{ steps.runtime-cache.outputs.cache-matched-key }}
          PRIMARY: ${{ steps.runtime-keys.outputs.primary }}
          LEGACY: ${{ steps.runtime-keys.outputs.legacy }}
        run: |
          if ($env:MATCHED -and $env:MATCHED -ne $env:PRIMARY -and $env:MATCHED -ne $env:LEGACY) { throw 'Unexpected runtime cache prefix match' }
      - name: Compile matching workers and test media, MCP and updates
        env:
          VERIFY_BUILD_GRAPH: ${{ inputs.verify_build_graph }}
        run: ./tools/windows-qa.ps1 -Cache "$env:RUNNER_TEMP/noh-downloads" -Runtime "$env:RUNNER_TEMP/noh-test-ffmpeg" -ValidateHelpers:($env:VERIFY_BUILD_GRAPH -eq 'true')
      - name: Acquire locked full offline runtime
        if: ${{ !inputs.verify_build_graph }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/delivery.py acquire --platform windows-x64 --cache "$env:RUNNER_TEMP/noh-downloads" --output logs/setup/inputs
      - name: Save locked runtime downloads after validation
        if: ${{ !inputs.verify_build_graph && steps.runtime-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/codex/setup-release' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/noh-downloads
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - name: Build only the new application version and seal its three profiles
        if: ${{ !inputs.verify_build_graph }}
        env:
          NOH_SETUP_SIGNING_KEY_BASE64: ${{ secrets.NOH_SETUP_SIGNING_KEY_BASE64 }}
          NEW_VERSION: ${{ inputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NOH_SETUP_SIGNING_KEY_BASE64)) { throw 'Stable NOH Setup signing key is not configured' }
          $key = "$env:RUNNER_TEMP/noh-setup-signing-key.pk8"
          try {
            [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:NOH_SETUP_SIGNING_KEY_BASE64))
            Remove-Item Env:NOH_SETUP_SIGNING_KEY_BASE64
            ./tools/update-setup-clients.ps1 -Stage Build -NewVersionOnly -BaselineLock "$PWD/assets/setup-baseline.lock.json" -VersionB $env:NEW_VERSION -CandidateDirectory "$PWD/logs/setup-candidate" -PackageId NOH -PublicKeys "$env:RUNNER_TEMP/noh-setup-public-keys.json" -SigningKey $key -Ffmpeg "$PWD/logs/setup/inputs/native/export/ffmpeg.exe" -Speech "$PWD/logs/setup/inputs/speech" -Libmpv "$PWD/logs/setup/inputs/native/preview/libmpv-2.dll" -NativeNotices "$PWD/logs/setup/inputs/materials/native-notices" -ToolDirectory "$env:RUNNER_TEMP/noh-setup-tools"
          } finally {
            if (Test-Path -LiteralPath $key) { Remove-Item -LiteralPath $key }
          }
      - name: Keep exact private candidates for local native acceptance
        if: ${{ !inputs.verify_build_graph }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noh-windows-setup-candidate
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          # Explicit allowlist: never upload source trees, signing private keys,
          # build caches, runtime downloads or Velopack intermediate packages.
          path: |
            logs/setup-candidate/candidate.json
            logs/setup-candidate/baseline.json
            logs/setup-candidate/source-inventory.json
            logs/setup-candidate/keys.json
            logs/setup-candidate/release-B*.json
            logs/setup-candidate/envelope-B*.json
            logs/setup-candidate/packages-B*/*-Setup.exe
            logs/setup-candidate/tools/update-release.exe
            logs/setup-candidate/tools/bootstrap-B.exe
      - name: Keep diagnostics without signing material
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noh-windows-setup-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            logs/setup/*.log
            logs/setup/*.json
            logs/setup-candidate/logs/*
            logs/setup-candidate/result.json
      - name: Record cache observations
        if: always()
        run: |
          @'
          ## Windows cache observations
          | Layer | Restore step outcome | Exact cache hit |
          | --- | --- | --- |
          | Rust toolchain | ${{ steps.rust-toolchain-cache.outcome }} | ${{ steps.rust-toolchain-cache.outputs.cache-hit }} |
          | Tool archives | ${{ steps.setup-tools-cache.outcome }} | ${{ steps.setup-tools-cache.outputs.cache-hit }} |
          | Cargo dependencies | ${{ steps.cargo-cache.outcome }} | ${{ steps.cargo-cache.outputs.cache-hit }} |
          | QA comparison reference (read-only) | ${{ steps.qa-reference-cache.outcome }} | ${{ steps.qa-reference-cache.outputs.cache-hit }} |
          | Runtime downloads | ${{ steps.runtime-cache.outcome }} | ${{ steps.runtime-cache.outputs.cache-hit }} |

          A blank hit value can mean a miss; use the step outcome to distinguish
          skipped or failed restores. Cache transfers are timed
          in their individual steps; compare total job time on a cold and a warm
          required run before claiming a gain. NOH application binaries and final
          signed packages are rebuilt and qualified, not promoted from a cache.
          '@ >> $env:GITHUB_STEP_SUMMARY

  installers:
    if: ${{ !inputs.verify_build_graph }}
    needs: candidate
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/windows-installers.yml
    with:
      source_run_id: ${{ format('{0}', github.run_id) }}
      source_attempt: ${{ needs.candidate.outputs.source_attempt }}
      source_commit: ${{ github.sha }}
