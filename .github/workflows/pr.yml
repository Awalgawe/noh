name: PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select platforms and run fast controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      windows: ${{ steps.scope.outputs.windows }}
      unix: ${{ steps.scope.outputs.unix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify routing and merge-gate controls
        run: python3 -m unittest discover -s tools -p test_ci_scope.py
      - name: Select native platforms from the complete Git diff
        id: scope
        run: python3 tools/ci_scope.py
      - name: Check build and delivery scripts with synthetic fixtures
        if: steps.scope.outputs.windows == 'true' || steps.scope.outputs.unix == 'true'
        run: |
          python3 tools/test-delivery.py
          python3 tools/test-linux-elf.py
          python3 tools/test-linux-inputs.py
          python3 tools/test-linux-package.py
          python3 tools/test-linux-host-runtime.py
          python3 tools/test-linux-matrix.py
          python3 tools/test-linux-desktop.py
          python3 -m unittest discover -s tools/installer -p 'test_*.py'
          python3 tools/test-runtime-cache.py
          python3 -m unittest discover -s tools -p test_setup_delivery.py

  audit:
    needs: scope
    if: needs.scope.outputs.windows == 'true' || needs.scope.outputs.unix == 'true'
    uses: ./.github/workflows/rust-audit.yml

  windows:
    name: Windows QA
    needs: [scope, audit]
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: never
      RUSTFLAGS: -C linker-flavor=ld.lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Resolve pinned compiler inputs
        id: inputs
        run: |
          $policy = Get-Content assets/delivery-policy.json -Raw | ConvertFrom-Json
          $compiler = (Get-Content assets/setup-tools.lock.json -Raw | ConvertFrom-Json).compiler
          "toolchain=$($policy.rust_version)-x86_64-pc-windows-gnu" >> $env:GITHUB_OUTPUT
          "compiler_hash=$($compiler.hash)" >> $env:GITHUB_OUTPUT
      - name: Restore compiler archive
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/noh-pr-compiler/*.zip
          key: noh-pr-compiler-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.compiler_hash }}
      - name: Prepare Rust and the compiler only
        env:
          PR_TOOLCHAIN: ${{ steps.inputs.outputs.toolchain }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:CARGO_ENCODED_RUSTFLAGS) { throw 'Unexpected encoded Rust flags' }
          rustup toolchain install $env:PR_TOOLCHAIN --profile minimal --component rustfmt
          rustup default $env:PR_TOOLCHAIN
          "RUSTUP_TOOLCHAIN=$env:PR_TOOLCHAIN" >> $env:GITHUB_ENV
          $spec = (Get-Content assets/setup-tools.lock.json -Raw | ConvertFrom-Json).compiler
          $directory = Join-Path $env:RUNNER_TEMP 'noh-pr-compiler'
          [void][IO.Directory]::CreateDirectory($directory)
          $archive = Join-Path $directory $spec.name
          if (-not (Test-Path -LiteralPath $archive)) { Invoke-WebRequest -Uri $spec.url -OutFile $archive }
          if ((Get-FileHash -LiteralPath $archive -Algorithm $spec.algorithm).Hash.ToLowerInvariant() -ne $spec.hash) { throw 'Compiler archive hash mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $compiler = Join-Path $directory ([IO.Path]::GetFileNameWithoutExtension($spec.name) + '/bin')
          foreach ($file in @('clang.exe', 'llvm-ar.exe')) {
            if (-not (Test-Path -LiteralPath "$compiler/$file" -PathType Leaf)) { throw "Missing compiler tool: $file" }
          }
          "CC=$compiler/clang.exe" >> $env:GITHUB_ENV
          "AR=$compiler/llvm-ar.exe" >> $env:GITHUB_ENV
      - name: Check formatting before compilation
        run: cargo fmt --all --check
      - name: Restore compatible Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: noh-pr-windows-qa-v1-${{ steps.inputs.outputs.compiler_hash }}
          workspaces: . -> target
          cache-bin: 'false'
          cache-workspace-crates: 'false'
          cache-on-failure: 'false'
      - name: Restore only test-runtime downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/noh-pr-downloads
          key: noh-pr-ffmpeg-v1-${{ hashFiles('assets/delivery-windows.lock.json', 'assets/windows-native.lock.json') }}
      - name: Fetch locked dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fetch --locked
      - name: Compile QA workers and run GUI, CLI, media, MCP and update tests
        run: ./tools/windows-qa.ps1 -Cache "$env:RUNNER_TEMP/noh-pr-downloads" -Runtime "$env:RUNNER_TEMP/noh-pr-ffmpeg"
      - name: Show timings and test results without artifact storage
        if: always()
        run: |
          foreach ($file in Get-ChildItem logs/setup/*.process.json -ErrorAction SilentlyContinue) {
            $record = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json
            "$($file.Name): exit=$($record.exit), seconds=$($record.seconds), timed_out=$($record.timed_out)"
            if ($record.exit -ne 0 -or $record.error) {
              $prefix = $file.FullName -replace '\.process\.json$', ''
              foreach ($stream in @('stdout', 'stderr')) {
                Get-Content -LiteralPath "$prefix.$stream.log" -Tail 80 -ErrorAction SilentlyContinue
              }
            }
          }
          if (Test-Path logs/setup/verification.stdout.log) {
            Select-String -Path logs/setup/verification.stdout.log -Pattern '^test result:' | ForEach-Object Line
          }
      - name: Retain QA diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-pr-diagnostics
          path: |
            logs/setup/*.json
            logs/setup/*.log
          if-no-files-found: warn
          retention-days: 7

  unix:
    needs: [scope, audit]
    if: needs.scope.outputs.unix == 'true'
    uses: ./.github/workflows/native.yml
    with:
      skip_audit: true

  # TEMPORARY TRIAL, to remove before merge: does Mesa's software OpenGL let the
  # published Windows package open its interface and draw a caption effect on a
  # hosted runner? It is not part of the required checks.
  windows-software-opengl-trial:
    name: Trial - Windows package with software OpenGL
    if: github.event_name == 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PACKAGE_URL: https://github.com/Awalgawe/noh/releases/download/v0.1.6-pre.1/NOH-0.1.6-windows-x64.zip
      PACKAGE_SHA256: 2bd4d639f20e41be2325a4fd79df95c060cd20bc8166593c34ccaf8d33238bba
      # 26.2.5, not 26.2.6: the 26.2.6 release notes say its MSVC package has no OpenGL software rendering.
      MESA_URL: https://github.com/pal1000/mesa-dist-win/releases/download/26.2.5/mesa3d-26.2.5-release-msvc.7z
      MESA_SHA256: 997123ef4ce8896204ab912d5b54f19372c487ff9835bcefafa2fca23b8953c2
      GALLIUM_DRIVER: llvmpipe
    steps:
      - name: Download and check the published package and Mesa
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $work = Join-Path $env:RUNNER_TEMP 'trial'
          [void][IO.Directory]::CreateDirectory($work)
          foreach ($item in @(@('package.zip', $env:PACKAGE_URL, $env:PACKAGE_SHA256), @('mesa.7z', $env:MESA_URL, $env:MESA_SHA256))) {
            $file = Join-Path $work $item[0]
            curl.exe --fail --location --silent --show-error --output $file $item[1]
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $item[2]) { throw "Hash mismatch: $($item[0])" }
          }
          tar.exe -xf (Join-Path $work 'package.zip') -C $work
          7z.exe x (Join-Path $work 'mesa.7z') "-o$(Join-Path $work 'mesa')" -y | Select-Object -Last 6
          Get-ChildItem (Join-Path $work 'mesa') -Recurse -Filter *.dll | ForEach-Object { $_.FullName.Substring($work.Length) }
          $app = (Get-ChildItem $work -Recurse -Filter noh.exe | Select-Object -First 1).Directory.FullName
          "NOH_TRIAL_APP=$app" >> $env:GITHUB_ENV
          "NOH_TRIAL_WORK=$work" >> $env:GITHUB_ENV
          Get-ChildItem $app -Recurse -Filter *.exe | ForEach-Object { $_.FullName.Substring($app.Length) }
      - name: Record the behaviour without Mesa
        continue-on-error: true
        run: |
          $env:NOH_CAPTURE_UI = Join-Path $env:NOH_TRIAL_WORK 'before.ppm'
          $process = Start-Process -FilePath (Join-Path $env:NOH_TRIAL_APP 'noh.exe') -PassThru -RedirectStandardError (Join-Path $env:NOH_TRIAL_WORK 'before.err')
          $null = $process.Handle
          if (-not $process.WaitForExit(90000)) { $process.Kill(); 'Timed out' }
          "Exit without Mesa: $($process.ExitCode)"
          Get-Content (Join-Path $env:NOH_TRIAL_WORK 'before.err') -Tail 20 -ErrorAction SilentlyContinue
      - name: Open the interface with Mesa beside the executables
        run: |
          $ErrorActionPreference = 'Stop'
          $opengl = Get-ChildItem (Join-Path $env:NOH_TRIAL_WORK 'mesa') -Recurse -Filter opengl32.dll |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $opengl) { throw 'The Mesa archive holds no 64-bit opengl32.dll: nothing was tried' }
          $mesa = $opengl.Directory.FullName
          # opengl32.dll is only a loader; the drivers are in libgallium_wgl.dll. Both or nothing.
          $driver = Join-Path $mesa 'libgallium_wgl.dll'
          if (-not (Test-Path -LiteralPath $driver)) { throw 'The Mesa archive holds no libgallium_wgl.dll beside opengl32.dll: nothing was tried' }
          "Mesa OpenGL taken from $mesa"
          foreach ($folder in @($env:NOH_TRIAL_APP, (Join-Path $env:NOH_TRIAL_APP 'bin'))) {
            Copy-Item $opengl.FullName $folder
            Copy-Item $driver $folder
          }
          $env:NOH_CAPTURE_UI = Join-Path $env:NOH_TRIAL_WORK 'after.ppm'
          $env:NOH_LANGUAGE = 'fr'
          $process = Start-Process -FilePath (Join-Path $env:NOH_TRIAL_APP 'noh.exe') -PassThru -RedirectStandardError (Join-Path $env:NOH_TRIAL_WORK 'after.err')
          $null = $process.Handle
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'The interface did not close after its capture' }
          Get-Content (Join-Path $env:NOH_TRIAL_WORK 'after.err') -Tail 20 -ErrorAction SilentlyContinue
          Get-ChildItem $env:NOH_TRIAL_WORK -Filter 'after.*' | ForEach-Object { "$($_.Name) $($_.Length)" }
          "Raw interface exit code: '$($process.ExitCode)'"
          if ($process.ExitCode -ne 0) { throw "Interface exit code $($process.ExitCode)" }
          $report = Get-Content (Join-Path $env:NOH_TRIAL_WORK 'after.json') -Raw
          $report
          # The same two conditions as the installer check (tools/installer/public-ci.py, test_profile).
          $gui = $report | ConvertFrom-Json
          if (-not $gui.capture_ready -or $gui.timed_out) { throw 'The interface capture was not ready or timed out' }
      - name: Burn captions with an effect from the command line
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $work = $env:NOH_TRIAL_WORK
          $ffmpeg = (Get-ChildItem $env:NOH_TRIAL_APP -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          $cli = Join-Path $env:NOH_TRIAL_APP 'bin/noh-cli.exe'
          & $ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc2=s=1280x720:r=25' -f lavfi -i 'sine=frequency=440' -t 3 -pix_fmt yuv420p (Join-Path $work 'source.mp4')
          Set-Content -LiteralPath (Join-Path $work 'captions.srt') -Encoding utf8 -Value "1`n00:00:00,200 --> 00:00:02,800`nSoftware rendering trial`n"
          & $cli --list-effects
          & $cli --burn-subtitles (Join-Path $work 'source.mp4') --srt (Join-Path $work 'captions.srt') --output (Join-Path $work 'captioned.mp4') --effect noh.breath --json
          $result = Get-Item (Join-Path $work 'captioned.mp4')
          "captioned.mp4 $($result.Length) bytes"
          if ($result.Length -lt 10000) { throw 'The captioned export is empty' }

  required:
    name: PR checks
    if: always()
    needs: [scope, audit, windows, unix]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci_scope.py --gate
