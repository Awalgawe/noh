[package]
name = "noh"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
publish = false

[features]
default = []
gui = ["dep:eframe", "dep:rfd", "dep:open", "dep:rodio", "dep:libloading"]
mcp = ["dep:rmcp", "dep:tokio", "dep:tokio-util"]
updates = ["dep:ring", "dep:base64", "dep:semver", "dep:sha2", "dep:reqwest", "dep:tokio", "dep:windows-sys", "dep:quick-xml", "dep:zip"]

[dependencies]
ring = { version = "=0.17.14", optional = true }
base64 = { version = "0.22", optional = true }
semver = { version = "1", features = ["serde"], optional = true }
sha2 = { version = "0.10", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
quick-xml = {version = "0.41", optional = true}
zip = {version = "8.6", default-features = false, features = ["deflate"], optional = true}
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
rfd = { version = "0.17.2", optional = true }
open = { version = "5.3", optional = true }
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "wav"], optional = true }
libloading = { version = "0.8.9", optional = true }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
png = "0.18.1"
tracing = "0.1"
tempfile = "3.27"
process-wrap = { version = "9.1", features = ["std"] }
clap = { version = "4", features = ["derive"] }
skrifa = "0.44.0"
unicode-segmentation = "=1.13.3"
ctrlc = "3.5"
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "macros", "transport-io"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "net"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }

[dev-dependencies]
assert_cmd = "2.2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = {version = "0.61.2", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_IO", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes"]}

[build-dependencies]
embedinator = "=0.1.0"
sha2 = "0.10"
process-wrap = { version = "9.1", features = ["std"] }

[[example]]
name = "dev"
path = "tools/dev.rs"

[[example]]
name = "update-release"
path = "tools/update_release.rs"
required-features = ["updates"]

[[example]]
name = "update-measure"
path = "tools/update_measure.rs"
required-features = ["updates"]

[[example]]
name = "update-setup-probe"
path = "tools/update_setup_probe.rs"
required-features = ["updates"]

[[bin]]
name = "noh-update-guard"
path = "src/update_guard_main.rs"
required-features = ["updates"]

[[bin]]
name = "noh-update-repair"
path = "src/update_repair_main.rs"
required-features = ["updates"]

[[example]]
name = "scrub_probe"
path = "tools/scrub_probe.rs"
required-features = ["gui"]

[[bin]]
name = "noh"
path = "src/main.rs"

[[bin]]
name = "noh-app"
path = "src/app.rs"
required-features = ["gui"]

[[bin]]
name = "noh-mcp"
path = "src/mcp_main.rs"
required-features = ["mcp"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Fast native UI iteration and captures; delivery continues to use release.
[profile.qa]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
